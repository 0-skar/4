<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat</title>
    <link rel="manifest" href="manifest-chat.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7289da">
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <style>
        :root {
            --background-color: #2c2f33; --secondary-bg-color: #23272a; --header-bg-color: #1e2124;
            --text-color: #ffffff; --text-muted-color: #99aab5; --accent-color: #7289da;
            --private-msg-color: #f0b90c; --border-color: #444; --hover-color: #3a3e42;
            --notification-color: #198754; --danger-color: #dc3545; --voice-active-color: #43b581;
            --idle-color: #808b96;
            --sidebar-width: clamp(200px, 30vw, 240px); --transition-speed: 0.3s;
            --header-height: 52px;
        }
        @keyframes pulse-green { 0%, 100% { color: var(--voice-active-color); text-shadow: 0 0 10px var(--voice-active-color); } 50% { color: var(--idle-color); text-shadow: none; } }
        @keyframes pulse-red { 0%, 100% { color: var(--danger-color); text-shadow: 0 0 10px var(--danger-color); } 50% { color: var(--idle-color); text-shadow: none; } }
        @keyframes flash { 0%, 100% { background-color: var(--hover-color); } 50% { background-color: var(--notification-color); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--secondary-bg-color); }
        .app-layout { display: flex; flex-direction: column; height: 100%; }
        .chat-header { height: var(--header-height); box-sizing: border-box; padding: 0 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; background-color: var(--secondary-bg-color); border-bottom: 1px solid var(--border-color); }
        .chat-tabs { height: var(--header-height); box-sizing: border-box; border-bottom: 1px solid var(--border-color); padding: 5px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; }
        .private-chat-tabs { flex-wrap: wrap; gap: 5px; height: auto; padding: 5px 10px; flex-shrink: 0; display: none; align-items: center; background-color: var(--secondary-bg-color); border-bottom: 1px solid var(--border-color); }
        .sidebar.collapsed { width: 0; min-width: 0; border-left: none; overflow: hidden; }
        .sidebar-heading { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 0 0; margin-bottom: 15px; }
        .sidebar-heading h3 { margin: 0; font-size: clamp(0.75rem, 3vw, 0.9rem); text-transform: uppercase; color: var(--text-muted-color); }
        .header-left-panel { display: flex; align-items: center; gap: 12px; }
        .header-right-panel { display: flex; align-items: center; gap: 10px; }
        #sidebar-toggle { position: static; width: 30px; height: 30px; background-color: var(--accent-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        #private-chat-indicator { display: none; background-color: #40444b; color: var(--text-muted-color); padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: background-color 0.3s; }
        #private-chat-indicator.has-unread { animation: flash 1.5s infinite; color: white; }
        .main-content { display: flex; flex-direction: row; flex-grow: 1; min-height: 0; }
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; background-color: var(--background-color); }
        .chat-windows { position: relative; flex-grow: 1; }
        .chat-windows::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://raw.githubusercontent.com/0-skar/3/main/Trans%20S.png');
            background-repeat: no-repeat; background-position: center; background-size: contain;
            opacity: 0.1; pointer-events: none;
        }
        #form { flex-shrink: 0; display: flex; padding: 10px; gap: 6px; width: 100%; box-sizing: border-box; background-color: var(--secondary-bg-color); border-top: 1px solid var(--border-color); align-items: center;}
        .sidebar { width: var(--sidebar-width); flex-shrink: 0; background-color: var(--secondary-bg-color); display: flex; flex-direction: column; border-left: 1px solid var(--border-color); transition: width var(--transition-speed), min-width var(--transition-speed); }
        .user-slots-area { padding: 0 10px 10px 10px; flex-grow: 1; overflow-y: auto; }
        #header-title { color: var(--private-msg-color); font-weight: bold; font-size: clamp(1rem, 4vw, 1.25rem); transition: color 0.3s; }
        #install-app-btn, #download-app-btn { display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 8px; box-shadow: none; font-size: 1.1rem; cursor: pointer; padding: 4px 6px; color: var(--text-color); white-space: nowrap; }
        #download-app-btn { margin-left: -10px; } /* POBIERZ_V963: strzalka blizej ikony Kontakty (odstep w panelu to gap 12px + paddingi) */
        #install-app-btn .install-label, #download-app-btn .install-label { display: none; margin-left: 5px; font-size: 0.9rem; font-weight: 500; color: var(--text-color); }
        #install-app-btn:focus-visible, #download-app-btn:focus-visible { outline: 1px solid var(--border-color); outline-offset: 2px; }
        #install-app-btn:hover .install-label, #install-app-btn:focus-visible .install-label, #download-app-btn:hover .install-label, #download-app-btn:focus-visible .install-label { display: inline; }
        #clear-history-btn, #install-button { display: none; background: none; border: none; color: var(--text-muted-color); padding: 5px; cursor: pointer; font-size: 1.2rem; border-radius: 5px; line-height: 1; }
        #clear-history-btn:hover { color: var(--danger-color); background-color: var(--hover-color); }
        #install-button:hover { color: var(--accent-color); background-color: var(--hover-color); }
        .messages { list-style-type: none; margin: 0; padding: 15px; position: absolute; top: 0; bottom: 0; left: 0; right: 0; overflow-y: auto; font-size: clamp(0.9rem, 2.5vw, 1rem); }
        .system-message, .user-message, .private-message { padding-bottom: 8px; word-wrap: break-word; }
        .system-message { color: var(--text-muted-color); font-style: italic; text-align: center; }
        .user-message, .private-message { color: var(--text-color); }
        .private-message { font-style: italic; }
        .user-message .username-color { color: var(--accent-color); font-weight: bold; }
        .private-message .username-color { color: var(--private-msg-color); font-weight: bold; }
        .timestamp { font-size: 0.75em; color: var(--text-muted-color); margin-right: 8px; vertical-align: middle; }
        #input { flex-grow: 1; flex-shrink: 1; min-width: 0; padding: 12px; border: 1px solid var(--border-color); background-color: #40444b; color: var(--text-color); border-radius: 8px; font-size: 1rem; }
        #form button[type="submit"] { padding: 12px 18px; margin-left: 10px; border: none; background-color: var(--accent-color); color: var(--text-color); border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #mic-to-text-btn, #upload-btn { background: none; border: none; color: var(--text-muted-color); padding: 8px; margin-right: 5px; font-size: 1.5rem; cursor: pointer; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s; flex-shrink: 0; }
        #mic-to-text-btn:hover:not(:disabled), #upload-btn:hover:not(:disabled) { background-color: var(--hover-color); }
        #upload-btn:hover:not(:disabled) { color: var(--accent-color); }
        #mic-to-text-btn.listening { color: var(--danger-color); animation: pulse 1.5s infinite; }
        #form button[type="submit"] { flex-shrink: 0; }
        /* Dolny pasek na małych ekranach: mniejsze, równe ikony i przycisk Wyślij zawsze w całości na ekranie */
        @media (max-width: 600px) {
            #form { padding: 8px 6px; gap: 4px; }
            #mic-to-text-btn, #upload-btn { width: 38px; height: 38px; font-size: 1.25rem; padding: 4px; margin-right: 0; }
            #input { padding: 10px 8px; font-size: 0.95rem; }
            #form button[type="submit"] { padding: 10px 12px; margin-left: 0; font-size: 0.95rem; }
        }

        .file-attachment { margin-top: 6px; display: block; max-width: 100%; }
        .file-attachment img, .file-attachment video { max-width: 100%; max-height: 300px; border-radius: 6px; border: 1px solid var(--border-color); object-fit: contain; }
        .file-attachment audio { width: 100%; max-width: 300px; }
        .file-link { display: inline-flex; align-items: center; gap: 8px; background-color: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; text-decoration: none; color: var(--accent-color); transition: background 0.2s; }
        .file-link:hover { background-color: rgba(0,0,0,0.4); text-decoration: underline; }

        /* Podświetlone linki w wiadomościach */
        .chat-link {
            color: #4ea1ff;
            text-decoration: underline;
            word-break: break-all;
            transition: color 0.2s;
        }
        .chat-link:hover {
            color: #7bb8ff;
        }

        .tab-button { width: 100%; background: none; border: none; color: var(--text-muted-color); padding: 10px; text-align: left; cursor: pointer; border-radius: 5px; margin-bottom: 2px; font-size: clamp(0.8rem, 2.5vw, 0.9rem); transition: background-color 0.2s; white-space: nowrap; position: relative; display: flex; align-items: center; justify-content: space-between; }
        .private-chat-tabs .tab-button { width: auto; padding: 8px 12px; }
        .tab-button .tab-text { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; }
        .tab-button .close-tab-btn { font-size: 1.2rem; color: var(--text-muted-color); cursor: pointer; padding-left: 8px; line-height: 1; }
        .close-tab-btn:hover { color: var(--text-color); }
        .tab-button.active { color: var(--text-color); background-color: var(--accent-color); } .tab-button.has-unread { animation: flash 1.5s infinite; }
        .relationship-icon { cursor: pointer; margin-right: 8px; transition: color 0.2s; color: var(--private-msg-color); display: inline-flex; align-items: center; vertical-align: middle; }
        .relationship-icon svg { width: 1.1em; height: 1.1em; }
        .relationship-icon.favorite { color: var(--private-msg-color); }
        .relationship-icon.blocked { color: var(--danger-color); }
        .user-slot { display: flex; flex-direction: column; padding: 10px; margin-bottom: 8px; background-color: var(--background-color); border-radius: 5px; border: 1px solid var(--border-color); transition: background-color 0.3s, border-color 0.3s; }
        .user-slot.inactive { opacity: 0.6; }
        .user-slot.blocked-by-user { background-color: #4d2a2a; border-color: var(--danger-color); }
        .user-slot-header { display: flex; align-items: center; width: 100%; }
        .user-slot .user-name { font-weight: bold; flex-grow: 1; font-size: clamp(0.85rem, 2.5vw, 1rem); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inactive-icon { filter: grayscale(100%); }
        .action-button { background: none; border: none; color: var(--text-muted-color); font-size: 1.2rem; cursor: pointer; margin-left: 5px; padding: 0 5px; transition: color 0.2s; }
        .action-button.voice-toggle-btn.active { color: var(--voice-active-color); }
        .action-button.active-danger { color: var(--danger-color); }
        .action-button:hover { color: #ff4d4d; }
        .action-button.voice-toggle-btn:hover { color: var(--voice-active-color); }
        .form-inline { margin-top: 10px; display: flex; flex-direction: column; }
        .form-inline input { padding: 8px; margin-bottom: 5px; background: var(--secondary-bg-color); border: 1px solid var(--border-color); color: white; border-radius: 3px; font-size: 0.9rem; }
        .form-inline button, .action-menu button { width: 100%; padding: 8px; background: var(--accent-color); border: none; color: white; border-radius: 3px; cursor: pointer; font-size: 0.9rem; margin-top: 5px; }
        .action-menu button.delete-btn { background-color: var(--danger-color); }
        #home-link { display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted-color); text-decoration: none; border-radius: 50%; width: 34px; height: 34px; transition: background-color 0.2s, color 0.2s; flex-shrink: 0; }
        #home-link:hover { background-color: var(--hover-color); color: var(--text-color); }
        #home-link svg { width: 22px; height: 22px; }
        #call-btn { display: none; background: none; border: none; color: var(--idle-color); padding: 5px; cursor: pointer; font-size: 1.5rem; border-radius: 50%; line-height: 1; transition: color 0.2s; margin-left: auto; width: 40px; height: 40px; }
        #call-btn:hover { filter: brightness(1.2); }
        #call-btn.calling { animation: pulse-red 1.5s infinite; }
        #call-btn.incoming-call { animation: pulse-green 1.5s infinite; }
        /* --- WIDEO (kamerki): przesuwalne ramki, przyciski tylko z ikon --- */
        #video-call-btn { background: none; border: none; color: var(--idle-color); padding: 2px; cursor: pointer; font-size: 1rem; border-radius: 50%; line-height: 1; transition: color 0.2s; width: 30px; height: 30px; display: none; margin-left: auto; }
        #video-call-btn:hover { filter: brightness(1.3); }
        #video-call-btn.active { color: var(--voice-active-color); }
        #video-call-btn.incoming-call { animation: pulse-green 1.5s infinite; }
        #video-call-btn.calling { animation: pulse-red 1.5s infinite; }
        #video-call-btn + #call-btn { margin-left: 0; }
        .action-button.video-toggle-btn.active { color: var(--voice-active-color); }
        #video-panel { display: none; flex-direction: column; background-color: #14161a; border-bottom: 2px solid var(--accent-color); height: 44vh; min-height: 180px; flex-shrink: 0; }
        #video-panel.visible { display: flex; }
        #video-hidden-bar { display: none; padding: 4px 8px; flex-wrap: wrap; gap: 6px; align-items: center; }
        .hidden-chip { background: #40444b; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; padding: 0; }
        .hidden-chip:hover { background: var(--hover-color); }
        #video-grid { position: relative; flex: 1; min-height: 0; overflow: hidden; }
        .video-tile { position: absolute; width: var(--tile-w, 150px); background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid var(--border-color); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
        .video-tile:active { cursor: grabbing; }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; pointer-events: none; }
        .video-tile.local video { transform: scaleX(-1); }
        .video-tile-btns { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; z-index: 3; }
        .video-name-label { position: absolute; bottom: 4px; left: 4px; z-index: 2; background: rgba(0,0,0,0.55); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: var(--name-fs, 12px); line-height: 1.35; pointer-events: none; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-icon-btn { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; font-size: 0.85rem; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
        .video-icon-btn:hover { background: rgba(220,53,69,0.85); }
        .video-icon-btn.sound:hover { background: rgba(114,137,218,0.85); }

    </style>
</head>

    <script>
        const VAPID_PUBLIC_KEY = "BD8O0XhtyebRHHOUgMtsdkNl1j6C_ugAmEPGnXEiy-SuDK6JJIYgrdKXquvk3gmYuujmmft7WQMnTZlibryenyQ=";
        function registerServiceWorker() { if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').then(r => console.log('SW registered.')).catch(e => console.error('SW error.', e)); } }
        // INSTALL_V955: przycisk Pobierz — link https (http blokowalo pobieranie ze strony https), bez preview, plik pobiera sie jako zalacznik przy glownej nazwie — otwiera link do pobrania aplikacji Kontakty (call.html) z serwera plikow uzytkownika.
        // INSTALL_PAGES: przycisk otwiera Kontakty z GitHub Pages — z tego adresu instaluje sie aplikacje z ikona S.
        const KONTAKTY_PAGES_URL = "https://0-skar.github.io/3/call.html";
        // POBIERZ_V962/V963: przywrocony osobny przycisk Pobierz — pobiera plik call.html z boxa (ten sam link co w serii INSTALL_V95x); przycisk Kontakty (Pages) zostaje obok.
        const KONTAKTY_DOWNLOAD_URL = "https://eosforus-box.hf.space/download/Forum/call.html?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ2aWV3ZXIiLCJmaWxlX3BhdGgiOiJGb3J1bS9jYWxsLmh0bWwiLCJleHAiOjQ5NDY0MzgxODF9.nEEfwMxrOZkqsB9-9Qi5b3TlztqTVxt84rvqMRkA7a0";
        function setupInstallButton() {
            const btn = document.getElementById('install-app-btn');
            const dlBtn = document.getElementById('download-app-btn');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isStandalone) { if (btn) btn.style.display = 'none'; if (dlBtn) dlBtn.style.display = 'none'; return; }
            if (btn) { btn.addEventListener('click', () => { window.open(KONTAKTY_PAGES_URL, '_blank'); }); }
            if (dlBtn) { dlBtn.addEventListener('click', () => { window.open(KONTAKTY_DOWNLOAD_URL, '_blank'); }); }
        }
        function urlBase64ToUint8Array(base64String) { const padding = '='.repeat((4 - base64String.length % 4) % 4); const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/'); const rawData = window.atob(base64); const outputArray = new Uint8Array(rawData.length); for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); } return outputArray; }

        function linkify(text) {
            if (!text) return "";

            // 1. Escapujemy HTML, żeby uniknąć XSS
            let result = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

            // 2. Zamiana popularnych emotikon tekstowych na emoji
            const emoticons = [
                { regex: /&lt;3/g, emoji: "❤️" },
                { regex: /&lt;\/3/g, emoji: "💔" },
                { regex: /:\)/g, emoji: "🙂" },
                { regex: /:\(/g, emoji: "🙁" },
                { regex: /:D/gi, emoji: "😀" },
                { regex: /;\)/g, emoji: "😉" },
                { regex: /:P/gi, emoji: "😛" },
                { regex: /:p/g, emoji: "😛" },
                { regex: /:o/gi, emoji: "😮" },
                { regex: /:O/g, emoji: "😮" },
                { regex: /:\|/g, emoji: "😐" },
                { regex: /:\'\(/g, emoji: "😢" },
                { regex: /:\'\)/g, emoji: "😂" },
                { regex: /xd/gi, emoji: "😆" },
                { regex: /xD/g, emoji: "😆" },
                { regex: /;P/gi, emoji: "😜" },
                { regex: /:3/g, emoji: "😺" },
                { regex: /&gt;:\(/g, emoji: "😠" },
                { regex: /&gt;:\)/g, emoji: "😈" },
                { regex: /:\*/g, emoji: "😘" },
                { regex: /\^_\^/g, emoji: "😊" },
                { regex: /-_-/g, emoji: "😑" },
                { regex: /o_o/gi, emoji: "😳" },
                { regex: /O_O/g, emoji: "😲" },
                { regex: /\^o\^/g, emoji: "😄" },
                { regex: /T_T/g, emoji: "😭" },
                { regex: /;_;/g, emoji: "😭" },
                { regex: /\(y\)/gi, emoji: "👍" },
                { regex: /\(n\)/gi, emoji: "👎" },
            ];

            for (const { regex, emoji } of emoticons) {
                result = result.replace(regex, emoji);
            }

            // 3. Wykrywamy URL-e i zamieniamy na klikalne linki
            const urlRegex = /(\b(https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]\}])/gi;

            result = result.replace(urlRegex, (url) => {
                let href = url;
                if (url.toLowerCase().startsWith("www.")) {
                    href = "https://" + url;
                }
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>`;
            });

            return result;
        }

                switch(data.type) {
                    case 'user_update': renderUsers(data.payload.users); break;
                    case 'chat_message': if (data.payload.username !== sessionUsername) addMessage(data.payload, 'public'); break;
                    case 'chat_file_message': if (data.payload.username !== sessionUsername) addMessage(data.payload, 'public'); break; 
                    
                    case 'private_message':
                    case 'private_file_message': 
                        if (data.payload.sender === sessionUsername) break;
                        const sender = data.payload.sender;
                        const chatPartner = sender;
                        if (!document.getElementById(`messages-${chatPartner}`)) { createChatWindow(chatPartner, `Priv: ${chatPartner}`); }
                        addMessage(data.payload, chatPartner);
                        if (activeChat !== chatPartner) { ui.privateChatIndicator.classList.add('has-unread'); const tab = document.getElementById(`tab-private-${chatPartner}`); if(tab) tab.classList.add('has-unread'); }
                        lastPrivateChatPartner = chatPartner;
                        ui.privateChatIndicator.textContent = chatPartner;
                        ui.privateChatIndicator.style.display = 'inline-block';
                        break;
                    
                    case 'device_token_issued': localStorage.setItem('forumDeviceToken', data.payload.token); break;
                    case 'history_cleared': const publicChat = document.getElementById('messages-public'); if(publicChat) publicChat.innerHTML = ''; addMessage({username:'System', message:'Czat publiczny został wyczyszczony'}, 'public'); break;
                    case 'private_history_cleared': { const partner = data.payload.partner; const messagesDiv = document.getElementById(`messages-${partner}`); if (messagesDiv) { messagesDiv.innerHTML = ''; addMessage({username: 'System', message: 'Historia tej rozmowy została usunięta.'}, partner); } break; }
                    case 'private_history': const partner = data.payload.partner; const history = data.payload.history; const messagesDiv = document.getElementById(`messages-${partner}`); if (messagesDiv) { messagesDiv.innerHTML = ''; history.forEach(msg => addMessage(msg, partner)); } break;
                    case 'join_success':
                        sessionUsername = data.payload.username; storedUsername = sessionUsername; removeActiveForms(); subscribeUserForPush();
                        if (!localStorage.getItem('forumDeviceToken')) { socket.send(JSON.stringify({ type: 'issue_device_token' })); }
                        const urlParams = new URLSearchParams(window.location.search);
                        const chatWith = urlParams.get('chat_with');
                        if (chatWith) {
                            pendingChatPartner = chatWith;
                            window.history.replaceState({}, document.title, window.location.pathname);
                        }
                        const caller = urlParams.get('caller');
                        if (urlParams.get('action') === 'answer_call' && caller) {
                            pendingChatPartner = caller;
                            socket.send(JSON.stringify({ type: 'call_answered', payload: { caller: caller, media: urlParams.get('media') || 'audio' } }));
                            if (urlParams.get('media') === 'video') { toggleVideo(true, { skipInitiate: true }); } else if (!isVoiceActive) { toggleVoice(); }
                            window.history.replaceState({}, document.title, window.location.pathname);
                        }
                        if (!chatWith && !caller) {
                            if(!document.getElementById('messages-public').hasChildNodes()) {
                                loadHistory();
                            }
                        }
                        break;
                    case 'join_failed': alert(`Logowanie nieudane: ${data.payload.reason}`); removeActiveForms(); renderUsers(allUsers); break;
                    case 'webrtc_signal': if (sessionUsername) handleWebRTCSignal(data.payload.sender, data.payload.signal); break;
                    case 'video_room_update': { videoRoomConfirmed = true;
                        const newParticipants = new Set((data.payload.participants || []).filter(u => u !== sessionUsername));
                        const leftPeers = [...videoParticipants].filter(u => !newParticipants.has(u));
                        videoParticipants = newParticipants;
                        if (videoContext === 'public') { leftPeers.forEach(peer => { if (isVideoActive) removeVideoTrackFromPeer(peer); else removeRemoteVideoTile(peer); }); if (isVideoActive) { addVideoTrackToPeers(); updateAllVoiceConnections(); } }
                        updateVideoPanel();
                        break; }
                    case 'incoming_call_online':
                        const incoming_caller = data.payload.caller;
                        incomingCallMedia = data.payload.media || 'audio';
                        if (activeChat !== incoming_caller) { openPrivateChat(incoming_caller); }
                        incomingCaller = incoming_caller;
                        if (incomingCallMedia === 'video') { ui.videoCallBtn.classList.add('incoming-call'); ui.videoCallBtn.title = `Odbierz rozmowę wideo od ${incoming_caller}` }
                        ui.callBtn.classList.add('incoming-call');
                        ui.callBtn.title = `Odbierz od ${incoming_caller}`;
                        addMessage({username:'System', message: incomingCallMedia === 'video' ? `Rozmowa wideo przychodząca od ${incoming_caller}... Kliknij 📹, aby odebrać z kamerą.` : `Połączenie przychodzące od ${incoming_caller}...`}, incoming_caller);
                        break;
                    case 'call_initiated': ui.callBtn.classList.add('calling'); ui.callBtn.title = "Anuluj dzwonienie"; if ((data.payload.media || 'audio') === 'video') { ui.videoCallBtn.classList.add('calling'); } addMessage({username:'System', message: (data.payload.media === 'video' ? `Rozmowa wideo do ${data.payload.recipient}...` : `Dzwonienie do ${data.payload.recipient}...`)}, activeChat); break;
                    case 'call_answered': { const answeredMedia = data.payload.media || 'audio'; const calleeName = data.payload.callee; resetCallButton(); ui.callBtn.classList.add('calling'); ui.callBtn.title = "Zakończ rozmowę"; if (answeredMedia === 'video') ui.videoCallBtn.classList.add('calling'); addMessage({username:'System', message:`${calleeName} odebrał(a) połączenie. Łączenie...`}, activeChat); if (answeredMedia === 'video') { if (!isVideoActive) { toggleVideo(true, { skipInitiate: true }); } else { updateAllVoiceConnections(); } } else if (!isVoiceActive) { toggleVoice(); } else { updateAllVoiceConnections(); } break; }
                    case 'call_declined': resetCallButton(); addMessage({username:'System', message:`${data.payload.callee} odrzucił(a) połączenie.`}, activeChat); break;
                    case 'call_timeout': resetCallButton(); addMessage({username:'System', message:`${data.payload.recipient} nie odebrał(a) połączenia.`}, activeChat); break;
                    case 'call_cancelled': if (incomingCaller && data.payload.caller === incomingCaller) { const cancelledBy = incomingCaller; resetCallButton(); addMessage({username:'System', message:`${cancelledBy} anulował(a) połączenie.`}, cancelledBy); } break;
                    case 'recipient_busy': resetCallButton(); addMessage({username:'System', message:`${data.payload.recipient} jest niedostępny lub odrzucił połączenie.`}, activeChat); break;
                }
            };
            socket.onclose = (e) => { console.log(`Rozłączono z kodem ${e.code}. Próbuję połączyć ponownie...`); if (e.code === 4001) { localStorage.removeItem('forumUsername'); localStorage.removeItem('forumPassword'); localStorage.removeItem('forumDeviceToken'); storedUsername = null; } resetSession(); setTimeout(connectWebSocket, 3000); };
            socket.onerror = (e) => { console.error("WebSocket error:", e); socket.close(); }
        }
        function closePrivateChat(id) { document.getElementById(`tab-private-${id}`)?.remove(); document.getElementById(`messages-${id}`)?.remove(); if (lastPrivateChatPartner === id) { const nextTab = ui.privateChatTabs.querySelector('.tab-button'); lastPrivateChatPartner = nextTab ? nextTab.id.replace('tab-private-', '') : null; if(lastPrivateChatPartner) { ui.privateChatIndicator.textContent = lastPrivateChatPartner; } else { ui.privateChatIndicator.style.display = 'none'; } } if (activeChat === id) { const nextTabToOpen = ui.privateChatTabs.querySelector('.tab-button')?.id.replace('tab-private-', '') || 'public'; switchChat(nextTabToOpen); } }
        function openPrivateChat(targetUser) { const currentUserData = allUsers.find(u => u.username === sessionUsername); const targetUserData = allUsers.find(u => u.username === targetUser); if (currentUserData && targetUserData?.relationships?.[sessionUsername] === 'blocked') { alert('Nie możesz rozpocząć rozmowy, ten użytkownik Cię zablokował.'); return; } removeActiveForms(); createChatWindow(targetUser, `Priv: ${targetUser}`); if (socket && socket.readyState === WebSocket.OPEN && targetUser !== sessionUsername) { socket.send(JSON.stringify({ type: "get_private_history", payload: { partner: targetUser } })); } switchChat(targetUser); }
        async function loadHistory() { try { const r = await fetch(historyUrl); if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`); const h = await r.json(); const publicChat = document.getElementById('messages-public'); if(publicChat) { publicChat.innerHTML = ''; h.forEach(m => addMessage(m, 'public')); } } catch (e) { console.error("Błąd ładowania historii: ", e); } }
        function removeActiveForms() { document.querySelectorAll('.form-inline, .action-menu').forEach(f => f.parentElement.removeChild(f)); document.querySelectorAll('.action-button.active-danger').forEach(btn => btn.classList.remove('active-danger')); }
        function showSelfActionMenu(slot, isPermanentAccount) { const menu = document.createElement('div'); menu.className = 'action-menu'; let menuHTML = ''; if (isPermanentAccount) { menuHTML += `<button class="logout-btn">Wyloguj</button>`; } menuHTML += `<button class="delete-btn">Usuń konto</button>`; menu.innerHTML = menuHTML; slot.appendChild(menu); const logoutBtn = menu.querySelector('.logout-btn'); if(logoutBtn) { logoutBtn.onclick = () => { localStorage.removeItem('forumPassword'); localStorage.removeItem('forumDeviceToken'); socket.send(JSON.stringify({ type: 'leave' })); }; } menu.querySelector('.delete-btn').onclick = () => { if(confirm('Czy na pewno chcesz trwale usunąć swoje konto i wszystkie swoje prywatne rozmowy? Tej akcji nie można cofnąć.')) { socket.send(JSON.stringify({ type: 'remove_user', payload: { username: sessionUsername } })); }}; }
        function showModeratorActionMenu(slot, targetUsername) { const menu = document.createElement('div'); menu.className = 'action-menu'; menu.innerHTML = `<button class="logout-btn">Wyloguj</button><button class="delete-btn">Usuń</button>`; slot.appendChild(menu); menu.querySelector('.logout-btn').onclick = () => { socket.send(JSON.stringify({ type: 'kick_user', payload: { username: targetUsername } })); removeActiveForms(); }; menu.querySelector('.delete-btn').onclick = () => { if(confirm(`Czy na pewno chcesz trwale usunąć konto ${targetUsername} i wszystkie jego prywatne rozmowy? Tej akcji nie można cofnąć.`)) { socket.send(JSON.stringify({ type: 'remove_user', payload: { username: targetUsername } })); removeActiveForms(); }}; }
        function showLoginForm(slot, targetUsername, isNewUser = false) {
            removeActiveForms(); const form = document.createElement('form'); form.className = 'form-inline';
            const passwordPlaceholder = isNewUser ? "Wymyśl hasło (puste = gość)" : "Podaj hasło";
            form.innerHTML = isNewUser ? `<input type="text" name="username" placeholder="Twoja nazwa..." required autocomplete="off">` : '';
            form.innerHTML += `<input type="password" name="password" placeholder="${passwordPlaceholder}" autocomplete="new-password"><button type="submit">${isNewUser ? 'Dołącz' : 'Zaloguj'}</button>`;
            form.onclick = (e) => e.stopPropagation();
            const nameElement = slot.querySelector('.user-name');
            if (nameElement) nameElement.style.cursor = 'default';
            form.onsubmit = (e) => {
                e.preventDefault(); const uname = isNewUser ? form.querySelector('[name="username"]').value.trim() : targetUsername; const pword = form.querySelector('[name="password"]').value.trim();
                if (uname) {
                    localStorage.setItem('forumUsername', uname); localStorage.setItem('forumPassword', pword);
                    socket.send(JSON.stringify({ type: 'join', payload: { username: uname, password: pword } }));
                    removeActiveForms();
                }
            };
            slot.appendChild(form); form.querySelector(isNewUser ? 'input[name="username"]' : 'input[type="password"]').focus();
        }
        function createRegistrationSlot() { ui.newUserSlot.innerHTML = ''; const slot = document.createElement('div'); slot.className = 'user-slot'; const header = document.createElement('div'); header.className = 'user-slot-header'; header.innerHTML = '<span class="user-name" style="color: var(--text-muted-color);">Dołącz do czatu...</span>'; slot.appendChild(header); header.onclick = () => { header.style.display = 'none'; showLoginForm(slot, '', true); }; ui.newUserSlot.appendChild(slot); }
        ui.form.addEventListener('submit', (e) => { e.preventDefault(); const message = ui.input.value.trim(); if (!message || !sessionUsername) return; let type, payload, messageData, targetChat; if (activeChat === 'public') { type = 'chat_message'; payload = { message }; messageData = { username: sessionUsername, message: message, timestamp: new Date().toISOString() }; targetChat = 'public'; } else { const currentUserData = allUsers.find(u => u.username === sessionUsername); if (currentUserData.relationships && currentUserData.relationships[activeChat] === 'blocked') { alert('Nie możesz wysłać wiadomości. Odblokuj najpierw tego użytkownika.'); return; } type = 'private_message'; payload = { recipient: activeChat, message }; messageData = { sender: sessionUsername, message: message, timestamp: new Date().toISOString() }; targetChat = activeChat; } addMessage(messageData, targetChat); socket.send(JSON.stringify({ type, payload })); ui.input.value = ''; });
        ui.sidebarToggle.addEventListener('click', () => { ui.sidebar.classList.toggle('collapsed'); ui.sidebarToggle.textContent = ui.sidebar.classList.contains('collapsed') ? '>' : '<'; });
        ui.clearHistoryBtn.addEventListener('click', () => { if (activeChat === 'public') { if(isModerator && confirm('Czy na pewno chcesz wyczyścić cały czat publiczny?')) { socket.send(JSON.stringify({ type: 'clear_history' })); } } else { const currentUserData = allUsers.find(u => u.username === sessionUsername); if (currentUserData && currentUserData.role !== 'user') { if(confirm(`Czy na pewno chcesz trwale usunąć całą historię rozmowy z ${activeChat}? Tej akcji nie można cofnąć.`)) { socket.send(JSON.stringify({ type: 'delete_private_history', payload: { partner: activeChat } })); } } } });
        ui.privateChatIndicator.onclick = () => { if(lastPrivateChatPartner) { openPrivateChat(lastPrivateChatPartner); } };
        ui.callBtn.addEventListener('click', () => {
            if (!sessionUsername || activeChat === 'public') return;
            if (ui.callBtn.classList.contains('calling')) {
                addMessage({username:'System', message:'Zakończyłeś/aś rozmowę.'}, activeChat);
                if (isVideoActive && videoContext === activeChat) toggleVideo(false);
                cleanupVoiceChat(activeChat);
                sendSignal(activeChat, { type: 'hangup' });
                if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'call_cancelled', payload: { recipient: activeChat } }));
                resetCallButton();
            } else if (ui.callBtn.classList.contains('incoming-call')) {
                if (incomingCaller) {
                    const media = incomingCallMedia;
                    socket.send(JSON.stringify({ type: 'call_answered', payload: { caller: incomingCaller, media } }));
                    resetCallButton(); ui.callBtn.classList.add('calling'); ui.callBtn.title = 'Zakończ rozmowę';
                    if (media === 'video') { toggleVideo(true, { skipInitiate: true }); } else if (!isVoiceActive) { toggleVoice(); }
                }
            } else {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'initiate_call', payload: { recipient: activeChat, media: 'audio' } }));
                }
            }
        });
        // --- WIDEO: przyciski ---
        ui.localSoundBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleVoice(); });
        ui.localCamOffBtn.addEventListener('click', (e) => { e.stopPropagation(); if (isVideoActive) toggleVideo(false); });
        ui.localZoomInBtn.addEventListener('click', (e) => { e.stopPropagation(); zoomTile('local', 1); });
        ui.localZoomOutBtn.addEventListener('click', (e) => { e.stopPropagation(); zoomTile('local', -1); });
        makeDraggable(ui.localVideoTile, 'local');
        ui.videoCallBtn.addEventListener('click', () => {
            if (!sessionUsername || activeChat === 'public') return;
            if (ui.videoCallBtn.classList.contains('incoming-call') && incomingCaller) {
                const media = 'video';
                socket.send(JSON.stringify({ type: 'call_answered', payload: { caller: incomingCaller, media } }));
                resetCallButton(); ui.callBtn.classList.add('calling'); ui.videoCallBtn.classList.add('calling');
                toggleVideo(true, { skipInitiate: true });
            } else if (isVideoActive && videoContext === activeChat) {
                endVideoSession();
            } else {
                if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'initiate_call', payload: { recipient: activeChat, media: 'video' } }));
                toggleVideo(true, { skipInitiate: true }); // lokalny podgląd od razu; połączenie zestawi się po odebraniu
            }
        });
        window.addEventListener('beforeunload', () => { if (isVideoActive && videoContext === 'public' && socket && socket.readyState === WebSocket.OPEN) { try { socket.send(JSON.stringify({ type: 'video_room_leave' })); } catch (e) {} } });
        
        ui.uploadBtn.addEventListener('click', () => {
            ui.fileInput.click();
        });

        ui.fileInput.addEventListener('change', async () => {
            const file = ui.fileInput.files[0];
            if (!file) return;

            if (activeChat !== 'public') {
                const currentUserData = allUsers.find(u => u.username === sessionUsername);
                if (currentUserData.relationships && currentUserData.relationships[activeChat] === 'blocked') {
                    alert('Nie możesz wysłać pliku. Odblokuj najpierw tego użytkownika.');
                    ui.fileInput.value = '';
                    return;
                }
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('username', sessionUsername);

            ui.uploadBtn.disabled = true;
            ui.uploadBtn.innerHTML = '⏳';

            try {
                const uploadUrl = apiBaseUrl + '/upload'; 
                
                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    body: formData,
                    cache: 'no-cache'
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Błąd wysyłania: ${response.status} ${errText}`);
                }

                const data = await response.json();
                
                const wsPayload = {
                    url: data.url,
                    filename: data.original_name,
                    file_type: file.type,
                    recipient: activeChat === 'public' ? null : activeChat
                };

                socket.send(JSON.stringify({
                    type: 'file_message',
                    payload: wsPayload
                }));

                const localMessageData = {
                    username: sessionUsername,
                    sender: sessionUsername,
                    type: 'file',
                    url: data.url,
                    filename: data.original_name,
                    file_type: file.type,
                    timestamp: new Date().toISOString()
                };
                
                addMessage(localMessageData, activeChat);

            } catch (error) {
                console.error("Szczegóły błędu uploadu:", error);
                alert("Nie udało się wysłać pliku. Sprawdź konsolę (F12) po szczegóły.");
            } finally {
                ui.uploadBtn.disabled = false;
                ui.uploadBtn.innerHTML = '+';
                ui.fileInput.value = '';
            }
        });

        // SESJA_V15: heartbeat aktywnosci, gdy karta jest widoczna (serwer wylogowuje po 60 min ciszy).
        setInterval(() => { if (socket && socket.readyState === WebSocket.OPEN && sessionUsername && document.visibilityState === 'visible') { socket.send(JSON.stringify({ type: 'ping' })); } }, 240000);
        registerServiceWorker();
        setupInstallButton();
        createChatWindow('public', 'Czat Publiczny');
        switchChat('public');
        connectWebSocket();
    </script>
</body>
</html>
